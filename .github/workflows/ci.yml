name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_USER: orchid
          POSTGRES_PASSWORD: orchid-local
          POSTGRES_DB: wallet_test
        ports:
          - "55433:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U orchid -d wallet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run test:lint
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run --cwd packages/wallet vitest run
      - run: bun run --cwd apps/web test
      - run: bun run build
